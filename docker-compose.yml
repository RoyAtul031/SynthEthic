version: '3.8'

services:
  synthethic-engine:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: synthethic-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - STORAGE_TYPE=postgres
      - DATABASE_URL=postgresql://synthethic:synthpass2026@postgres:5432/synthethic_db
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - DEFAULT_EPSILON=1.0
      - DEFAULT_DELTA=0.00001
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - synthethic-net

  synthethic-streamer:
    build:
      context: ./streamer-service
      dockerfile: Dockerfile
    container_name: synthethic-streamer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - PYTHON_ENGINE_URL=http://synthethic-engine:8000
      - ENTROPY_SALT=synthethic_entropy_salt_2026
    depends_on:
      - synthethic-engine
    networks:
      - synthethic-net

  synthethic-ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: synthethic-ui
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - synthethic-engine
    networks:
      - synthethic-net

  postgres:
    image: postgres:16-alpine
    container_name: synthethic-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=synthethic
      - POSTGRES_PASSWORD=synthpass2026
      - POSTGRES_DB=synthethic_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synthethic -d synthethic_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - synthethic-net

  minio:
    image: minio/minio:latest
    container_name: synthethic-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - synthethic-net

networks:
  synthethic-net:
    driver: bridge

volumes:
  postgres-data:
  minio-data:
